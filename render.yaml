# Render Blueprint — Part 2 of Week 6.
# This file lets you deploy with one click from the Render dashboard:
#   New > Blueprint > pick this repo > Apply.
#
# Render also auto-redeploys whenever main moves, which pairs with the
# CI workflow in .github/workflows/ci.yml.
#
# Add OPENAI_API_KEY in the Render dashboard:
#   Service > Environment > Add Environment Variable.
# Never commit it.

services:
  - type: web
    name: anime-story-generator
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # set this in the Render UI; do not commit
      - key: NODE_VERSION
        value: "20"
